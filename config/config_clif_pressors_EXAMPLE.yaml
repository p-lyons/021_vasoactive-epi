# ==============================================================================
# config_clif_pressors_EXAMPLE.yaml
# CLIF Vasopressor Escalation Study - Site Configuration TEMPLATE
#
# Copy this file to config/config_clif_pressors.yaml and edit the values.
# config_clif_pressors.yaml is git-ignored, so your local paths stay local.
# ==============================================================================

# Site identifier (lowercase)
# Must match a row in config/clif_sites.csv
site_lowercase: "yoursite"

# File format of your CLIF tables
# Options: "parquet", "csv", or "fst"
file_type: "parquet"

# Path to folder containing CLIF tables
# Tables should be named: clif_patient.parquet, clif_hospitalization.parquet, etc.
clif_data_location: "/path/to/your/clif_tables"

# Path to this project folder
# This is where the code/ and config/ folders are located
project_location: "/path/to/021_vasoactive-epi"

# IANA time zone of your site's timestamps (see the tz column of clif_sites.csv)
# Used by code/sankey_transitions_onepass.R; defaults to "UTC" if omitted
time_zone: "America/Chicago"
